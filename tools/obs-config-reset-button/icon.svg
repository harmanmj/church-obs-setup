<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Icon for the "OBS Configuration Reset" button (tools/obs-config-reset-button/button.sh); setup installs it with the app-menu entry. -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#2f6fd6"/>
  <g fill="#ffffff" font-family="Ubuntu, 'DejaVu Sans', sans-serif" font-weight="700" text-anchor="middle">
    <text x="32" y="25" font-size="19" textLength="44" lengthAdjust="spacingAndGlyphs">OBS</text>
    <text x="32" y="38" font-size="9.5" textLength="54" lengthAdjust="spacingAndGlyphs">Configuration</text>
    <text x="32" y="53" font-size="13" textLength="44" lengthAdjust="spacingAndGlyphs">Reset</text>
  </g>
</svg>
